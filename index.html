<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painéis CRV</title>
<style>
/* Página única dos painéis: cada aba abre a página original do GitHub Pages.
   VOICE: sóbrio, de trabalho — uma porta de entrada, não um painel novo
   IDEA: a barra de abas de um sistema de BI, como os próprios painéis
   PICTURE: o painel escolhido ocupa a tela inteira abaixo da barra
   COLOUR and TYPE: azul-marinho #22378c dos painéis, fundo #eef0f4; fonte do sistema
   LAYOUT: barra fina com título e três abas; painel em tela cheia */
:root{color-scheme:light;--bg:#eef0f4;--navy:#22378c;--navy2:#1a2b70;--ink:#1d2433;--muted:#5b6475;--line:#d9dde6}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--navy);color:#fff;display:flex;align-items:stretch;gap:24px;padding:0 max(2vw,14px);flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18);position:relative;z-index:2}
.brand{display:flex;flex-direction:column;justify-content:center;padding:10px 0;flex:none}
.brand b{font-size:17px;letter-spacing:.01em}
.brand span{font-size:12.5px;opacity:.75}
nav{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;display:flex;flex-direction:column;justify-content:center;min-height:52px;padding:8px 22px 9px;color:#fff;text-decoration:none;border-radius:8px 8px 0 0;opacity:.78;border-bottom:3px solid transparent;transition:background .15s,opacity .15s}
nav a:hover{opacity:1;background:rgba(255,255,255,.08)}
nav a:focus-visible{outline:2px solid #fff;outline-offset:-4px}
nav a[aria-selected=true]{opacity:1;background:var(--bg);color:var(--navy);border-bottom-color:var(--bg)}
nav a b{font-size:15px}
nav a small{font-size:12px;opacity:.8;white-space:nowrap}
.out{margin-left:auto;align-self:center;flex:none;color:#fff;opacity:.8;font-size:13px;text-decoration:none;padding:8px 10px;border-radius:6px}
.out:hover{opacity:1;background:rgba(255,255,255,.1)}
main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
@media(max-width:700px){
  .out{display:none}
  header{flex-direction:column;gap:0;padding:0}
  .brand{padding:10px 14px 6px}
  nav{padding:0 8px}
  nav a{min-height:48px;padding:6px 14px 7px}
}
@media(prefers-reduced-motion:reduce){nav a{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Painéis CRV</b><span>Consumo de combustível e pendências</span></div>
  <nav role="tablist" aria-label="Painéis">
    <a href="#colhedoras" role="tab" id="t-colhedoras" aria-selected="false"><b>Colhedoras</b></a>
    <a href="#transbordos" role="tab" id="t-transbordos" aria-selected="false"><b>Transbordos</b></a>
    <a href="#caminhoes" role="tab" id="t-caminhoes" aria-selected="false"><b>Caminhões</b></a>
    <a href="#fadiga" role="tab" id="t-fadiga" aria-selected="false"><b>Fadiga e Rastreador</b></a>
  </nav>
  <a class="out" id="out" href="#" target="_blank" rel="noopener">Abrir em nova janela ↗</a>
</header>
<main>
  <div class="loading" id="loading">Carregando painel…</div>
  <iframe id="f-colhedoras" title="Consumo Combustível Colhedoras CRV" data-src="https://joaovitor-crv.github.io/Consumo-de-colhedora/"></iframe>
  <iframe id="f-transbordos" title="Consumo Combustível Transbordos CRV" data-src="https://joaovitor-crv.github.io/consumo-transbordo/"></iframe>
  <iframe id="f-caminhoes" title="Consumo Combustível Caminhões CRV" data-src="https://joaovitor-crv.github.io/Consumo-de-caminh-es/"></iframe>
  <iframe id="f-fadiga" title="Pendências Fadiga e Rastreador CRV" data-src="fadiga.html"></iframe>
</main>
<script>
{
  const ids=['colhedoras','transbordos','caminhoes','fadiga'];
  const loading=document.getElementById('loading');
  const show=()=>{
    let h=(location.hash||'').slice(1);
    if(!ids.includes(h)){ try{h=localStorage.getItem('painel-crv')||''}catch(e){} }
    if(!ids.includes(h)) h=ids[0];
    for(const id of ids){
      const on=id===h, f=document.getElementById('f-'+id), t=document.getElementById('t-'+id);
      t.setAttribute('aria-selected',on);
      if(on) document.getElementById('out').href=f.dataset.src;
      f.classList.toggle('on',on);
      if(on && !f.src){
        loading.style.display='grid';
        f.addEventListener('load',()=>{loading.style.display='none'},{once:true});
        f.src=f.dataset.src;
      } else if(on){ loading.style.display='none' }
    }
    try{localStorage.setItem('painel-crv',h)}catch(e){}
  };
  window.addEventListener('hashchange',show);
  show();
}
</script>
</body>
</html>
